<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calc</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .calc{
            width: 280px;
            padding: 10px;
            margin: 20px auto;
            font-style: 0;
            background-color: beige;
            display: flex;
            flex-wrap: wrap;
        }
        .calc input{
            width: 100%;
            height: 70px;
            line-height: 70px;
            font-size: 30px;
            padding: 0.25em;
            margin: 0.3em;
            text-align: right;
        }
        .calc #clear{
            width: 100%;
        }
        .calc button{
            font-size: 20px;
            width: 65px;
            height: 65px;
        }
    </style>
</head>
<body>
    <div class="calc">
        <input type="text" name="" id="result" disabled>
        <button type="button" id="clear" onclick="clearBtn()">AC</button>
        <button type="button" onclick="calc(7)">7</button>
        <button type="button" onclick="calc(8)">8</button>
        <button type="button" onclick="calc(9)">9</button>
        <button type="button" onclick="calc('/')">/</button>
        <button type="button" onclick="calc(4)">4</button>
        <button type="button" onclick="calc(5)">5</button>
        <button type="button" onclick="calc(6)">6</button>
        <button type="button" onclick="calc('*')">X</button>
        <button type="button" onclick="calc(1)">1</button>
        <button type="button" onclick="calc(2)">2</button>
        <button type="button" onclick="calc(3)">3</button>
        <button type="button" onclick="calc('-')">-</button>
        <button type="button" onclick="calc(0)">0</button>
        <button type="button" onclick="calc('.')">.</button>
        <button type="button" onclick="endBtn()">=</button>
        <button type="button" onclick="calc('+')">+</button>
    </div>
</body>
</html>
<script>
    let result = document.getElementById("result");
    function calc(v){
        result.value += v;
    }
    function clearBtn(){
        result.value = "";
    }
    function endBtn(){
        result.value = eval(result.value);
    }
</script>
