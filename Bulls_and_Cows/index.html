<!DOCTYPE html>
<html lang="zn-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜數字遊戲</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="box">
        <h1>猜數字遊戲</h1>
        <div class="timer">
            <div class="item">
                <span>剩餘時間</span>
                <span id="mins">03</span>
                <span>：</span>
                <span id="sec">00</span>
            </div>
            <div class="item">
                <span>剩餘次數</span>
                <span id="count">8</span>
            </div>
        </div>
        <input type="text"  name="" id="user" placeholder="請輸入4位數值" maxlength="4">
        <button type="button" id="reset"onclick="window.location.reload()" disabled>再玩一次</button>
        <button type="button" id="btn">提交</button>
        <ul id="result"></ul>
        <div id="start">
            <button type="button" onclick="play()">開始玩</button>
        </div>
    </div>
</body>
</html>
<script src="js/style.js"></script>
